<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1426" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A dinner planner for your household. Pick the nights, choose the dinners, shop once.">
    <title>eatplanner.app</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/planner.css">
    <script type="module" src="/planner.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><img src="/favicon.svg" alt="" width="64" height="64">eatplanner<span>.app</span></a>
      <nav aria-label="Main navigation">
        <button id="nav-weeks" class="nav-link active" type="button" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/icons.svg#calendar"></use></svg><span>Weeks</span></button>
        <button id="nav-recipes" class="nav-link" type="button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#book"></use></svg><span>Recipes</span></button>
        <button id="add-recipe" class="button small" type="button"><svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"></use></svg><span>Add recipe</span></button>
      </nav>
      <button id="nav-admin" class="text-button admin-link" type="button" aria-label="Admin" title="Admin" hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#settings"></use></svg></button>
      <button id="sign-out" class="text-button" type="button" hidden>Sign out</button>
    </header>
    <main id="view" tabindex="-1"><p class="loading">Setting the table...</p></main>
    <footer>
      <span class="brand"><img src="/favicon.svg" alt="" width="64" height="64">eatplanner<span>.app</span></span>
      <label class="theme-picker" hidden>Appearance
        <select id="theme-picker"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
      </label>
    </footer>
    <p id="toast" class="toast" role="status" hidden></p>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="dialog-actions">
        <button id="close-modal" class="close-button" type="button" aria-label="Close dialog" autofocus>&times;</button>
        <button id="edit-recipe" class="dialog-icon-button" type="button" aria-label="Edit recipe" title="Edit recipe" hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"></use></svg></button>
      </div>
      <div id="modal-content"></div>
    </dialog>
  </body>
</html>
