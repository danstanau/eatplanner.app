<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#244b3b">
    <meta name="description" content="A thoughtful little meal planner for your home. Pick your week, find your dinners, and shop once.">
    <title>eatplanner.app - Dinner, a little more considered.</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/planner.css">
    <script type="module" src="/planner.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">eatplanner<span>.app</span><span class="brand-dot" aria-hidden="true"></span></a>
      <nav aria-label="Main navigation">
        <button id="nav-weeks" class="nav-link active" type="button">My weeks</button>
        <button id="nav-recipes" class="nav-link" type="button">Recipe collection</button>
      </nav>
      <button id="add-recipe" class="button small" type="button">+ Add recipe</button>
    </header>
    <main id="view" tabindex="-1"><p class="loading">Setting the table...</p></main>
    <footer><span class="brand">eatplanner<span>.app</span></span><p>A little less planning. A little more living.</p><span>Made for your home kitchen.</span></footer>
    <p id="toast" class="toast" role="status" hidden></p>
    <dialog id="modal" aria-labelledby="modal-title">
      <button id="close-modal" class="close-button" type="button" aria-label="Close dialog">&times;</button>
      <div id="modal-content"></div>
    </dialog>
  </body>
