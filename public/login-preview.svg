<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <style>
    text { font-family: "Trebuchet MS", sans-serif; fill: #131c3a; }
    .muted { fill: #4a5470; }
    .blue { fill: #1b3fa0; }
    .heading { font-size: 26px; font-weight: 700; }
    .meal { font-size: 18px; font-weight: 700; }
  </style>
  <defs>
    <g id="plate">
      <circle r="61" fill="#d3d9e4"/>
      <circle cy="-3" r="60" fill="#fff"/>
      <circle cy="-3" r="46" fill="#e8ecee"/>
    </g>
    <g id="greens" fill="#528357">
      <ellipse cx="-24" cy="-23" rx="13" ry="8" transform="rotate(-25)"/>
      <ellipse cx="-27" cy="-5" rx="14" ry="9"/>
      <ellipse cx="-21" cy="14" rx="12" ry="8" transform="rotate(15)"/>
    </g>
    <g id="pasta">
      <use href="#plate"/>
      <g fill="none" stroke="#e9b341" stroke-width="7" stroke-linecap="round">
        <path d="M-25-24q46-14 40 14t-39 17 42 13M-32-3q32-32 54-7t-39 23 25 15"/>
        <path d="M-23 26q-18-28 15-42t35 13"/>
      </g>
      <g fill="#c4533d"><circle cx="-19" cy="-14" r="7"/><circle cx="22" cy="7" r="7"/><circle cx="-9" cy="23" r="6"/></g>
      <g fill="#528357"><ellipse cx="9" cy="-25" rx="10" ry="5" transform="rotate(20)"/><ellipse cx="-12" cy="2" rx="10" ry="5" transform="rotate(-30)"/></g>
    </g>
    <g id="salmon">
