  <text x="84" y="306" class="heading">This week</text>
  <rect x="1260" y="276" width="96" height="32" rx="16" fill="#fdf2d0"/>
  <text x="1280" y="298" font-size="15">Planned</text>
  <path d="M84 324h1272" stroke="#131c3a" stroke-width="2"/>
  <path d="M266 324v340m182-340v340m182-340v340m182-340v340m182-340v340m182-340v340" stroke="#d3d9e4"/>
