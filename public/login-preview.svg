    <path fill="#e3e9f8" d="M100 380h150v160H100z"/>
    <path fill="#e8ecee" d="M282 380h150v160H282z"/>
    <path fill="#fdf2d0" d="M464 380h150v160H464z"/>
    <path fill="#e3e9f8" d="M828 380h150v160H828z"/>
    <path fill="#e8ecee" d="M1192 380h148v160h-148z"/>
