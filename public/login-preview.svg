      <path d="m2-18 20 5M-1-3l20 5M-5 12l20 5" stroke="#f3c7ac" stroke-width="3"/>
      <path d="M24 24a15 15 0 0 0 0-30z" fill="#f6ce53" stroke="#fff" stroke-width="2"/>
    </g>
    <g id="tacos">
