    <use href="#salmon" transform="translate(357 463)"/>
    <use href="#tacos" transform="translate(539 463)"/>
    <use href="#pasta" transform="translate(903 463) rotate(60)"/>
    <use href="#salmon" transform="translate(1266 463) rotate(-35)"/>
  </g>
  <g class="meal">
    <text x="100" y="574">Tomato pasta</text><text x="282" y="574">Lemon salmon</text>
    <text x="464" y="574">Chicken tacos</text><text x="646" y="460" class="muted">A night off</text>
    <text x="828" y="574">Pesto linguine</text><text x="1010" y="460" class="muted">A night off</text>
    <text x="1192" y="574">Sunday roast</text>
  </g>
  <g font-size="16" class="muted">
    <text x="100" y="603">25 min</text><text x="282" y="603">30 min</text><text x="464" y="603">30 min</text>
    <text x="828" y="603">20 min</text><text x="1192" y="603">60 min</text>
