      <g stroke="#cda142" stroke-width="2" fill="#f2cf71">
        <path d="M-33-24q-20 27 9 44l19-36q-12-19-28-8z"/>
        <path d="M9-20q-20 27 9 44L37-12q-12-19-28-8z"/>
      </g>
      <path d="m-26-14 9 3-10 9 7 3M16-10l9 3-10 9 7 3" fill="none" stroke="#528357" stroke-width="8"/>
      <g fill="#c4533d"><circle cx="-18" cy="-9" r="4"/><circle cx="-24" cy="7" r="4"/><circle cx="24" cy="-5" r="4"/><circle cx="18" cy="11" r="4"/></g>
    </g>
