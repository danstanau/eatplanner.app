  <text x="1015" y="48" font-size="18" class="blue">Weeks</text>
  <text x="1112" y="48" font-size="18" class="muted">Recipes</text>
  <rect x="1220" y="20" width="136" height="44" rx="8" fill="#1b3fa0"/>
